# New: this repo has no CI at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: iamthanh/lar-standards/.github/workflows/python-ci.yml@v2
    with:
      # Passed explicitly so the pinned tag above and the tag the drift job
      # compares against cannot silently disagree.
      standards-ref: 'v2'
      python-versions: '["3.12", "3.13"]'
      install: 'pip install -e ".[dev]"'
    secrets:
      ci-token: ${{ secrets.LAR_CI_TOKEN }}
