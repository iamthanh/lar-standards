# Reusable CI for LAR Rust repos.
#
# SOURCE OF TRUTH: iamthanh/lar-standards :: .github/workflows/rust-ci.yml
#
#   jobs:
#     ci:
#       uses: iamthanh/lar-standards/.github/workflows/rust-ci.yml@v2
#
# Unlike the Python gate, this one is whole-repo: lar-probability-engine is
# already green under it, so there is no backlog to phase in.

name: LAR Rust CI

on:
  workflow_call:
    inputs:
      test-command:
        type: string
        default: 'cargo test --workspace --all-features'
      standards-ref:
        type: string
        default: 'v2'
    secrets:
      ci-token:
        description: 'PAT with read access to the private LAR repos. Optional: lar-standards is public.'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and the rustfmt/clippy components.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: ${{ inputs.test-command }}

  drift:
    name: standards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lar-standards is public, so this clone needs no credentials. A token is
      # still used when one is supplied, purely for the higher API rate limit on
      # busy runners. Injected via url.insteadOf rather than embedded in the
      # clone URL, to keep it off the command line.
      #
      # Do NOT make the token mandatory again: lar-ingestion has no
      # LAR_CI_TOKEN yet, and a drift check that cannot run is the failure this
      # repo exists to prevent.
      - name: Fetch canonical standards
        env:
          CI_TOKEN: ${{ secrets.ci-token }}
        run: |
          set -euo pipefail
          if [ -n "${CI_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${CI_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi
          git clone --depth 1 --branch "${{ inputs.standards-ref }}" \
            https://github.com/iamthanh/lar-standards.git /tmp/lar-standards

      - name: Compare vendored copies
        run: |
          set -uo pipefail
          status=0
          if ! diff -u /tmp/lar-standards/config/.editorconfig .editorconfig; then
            echo "::error::.editorconfig has drifted from lar-standards@${{ inputs.standards-ref }}."
            status=1
          fi
          if [ -f CLAUDE.md ]; then
            awk '/BEGIN lar-standards shared block/,/END lar-standards shared block/' CLAUDE.md > /tmp/vendored-block.md
            if ! diff -u /tmp/lar-standards/agent/CLAUDE.shared.md /tmp/vendored-block.md; then
              echo "::error::The shared block in CLAUDE.md has drifted. Edit agent/CLAUDE.shared.md upstream."
              status=1
            fi
          else
            echo "::error::CLAUDE.md is missing."
            status=1
          fi
          exit $status
