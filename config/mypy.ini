# Canonical mypy config for every LAR Python repo.
#
# SOURCE OF TRUTH: iamthanh/lar-standards :: config/mypy.ini
# Do not edit the vendored copy in a consuming repo -- CI drift-check will fail.
#
# STATUS: advisory. CI runs mypy and prints results but does NOT gate the merge.
# The codebase is roughly half-typed (`from __future__ import annotations`
# appears in about half of all files in every repo), so a hard gate today would
# block all work behind a large retrofit. See standards/python.md "Ratchet" for
# the plan to make this blocking module-by-module.

[mypy]
# python_version is deliberately NOT set. This file is byte-identical across a
# 3.13 application and 3.12 libraries, so a pinned version would be wrong
# somewhere. mypy infers it from the interpreter running the check, which is
# the version that repo's CI actually targets.
namespace_packages = True
explicit_package_bases = True
scripts_are_modules = True

# Third-party stubs are inconsistent across the LAR dependency set (TA-Lib,
# pandas_market_calendars, polygon-api-client ship none).
ignore_missing_imports = True

# Off for now -- each of these becomes a ratchet step, not a day-one gate.
disallow_untyped_defs = False
warn_return_any = False
warn_unused_configs = False
no_strict_optional = True

# Report anything that would otherwise be silently skipped.
warn_unused_ignores = False
show_error_codes = True
